[project]
name = "device-cleanup"
version = "0.1.0"
description = "Audit and debloat Android devices: list installed apps, running processes and services, estimate RAM/storage gains, and safely disable or uninstall unused packages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
device-cleanup = "device_cleanup.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device_cleanup"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
